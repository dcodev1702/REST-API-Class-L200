<rect x="54" y="666.0" width="6" height="164" rx="3" fill="#50e6ff"/>
<text x="950" y="690.0" font-size="15" fill="#50e6ff" font-weight="700" text-anchor="end">OBJECT WITHIN AN OBJECT</text>
<text x="88" y="231.64" font-size="17" fill="#5b6478" class="mono" font-weight="400" text-anchor="end"> 1</text>
<text x="112" y="231.64" font-size="24" class="mono" xml:space="preserve"><tspan fill="#c8ccd4">{</tspan></text>
<text x="88" y="273.64" font-size="17" fill="#5b6478" class="mono" font-weight="400" text-anchor="end"> 2</text>
<text x="112" y="273.64" font-size="24" class="mono" xml:space="preserve"><tspan fill="#c8ccd4">  </tspan><tspan fill="#9cdcfe">&quot;id&quot;</tspan><tspan fill="#c8ccd4">: </tspan><tspan fill="#8fe3a1">1042</tspan><tspan fill="#c8ccd4">,</tspan></text>
<text x="88" y="315.64" font-size="17" fill="#5b6478" class="mono" font-weight="400" text-anchor="end"> 3</text>
<text x="112" y="315.64" font-size="24" class="mono" xml:space="preserve"><tspan fill="#c8ccd4">  </tspan><tspan fill="#9cdcfe">&quot;displayName&quot;</tspan><tspan fill="#c8ccd4">: </tspan><tspan fill="#f5b45a">&quot;Adele Vance&quot;</tspan><tspan fill="#c8ccd4">,</tspan></text>
<text x="88" y="357.64" font-size="17" fill="#5b6478" class="mono" font-weight="400" text-anchor="end"> 4</text>
<text x="112" y="357.64" font-size="24" class="mono" xml:space="preserve"><tspan fill="#c8ccd4">  </tspan><tspan fill="#9cdcfe">&quot;isActive&quot;</tspan><tspan fill="#c8ccd4">: </tspan><tspan fill="#ff8ac2">true</tspan><tspan fill="#c8ccd4">,</tspan></text>
<text x="88" y="399.64" font-size="17" fill="#5b6478" class="mono" font-weight="400" text-anchor="end"> 5</text>
<text x="112" y="399.64" font-size="24" class="mono" xml:space="preserve"><tspan fill="#c8ccd4">  </tspan><tspan fill="#9cdcfe">&quot;manager&quot;</tspan><tspan fill="#c8ccd4">: </tspan><tspan fill="#aab1bc">null</tspan><tspan fill="#c8ccd4">,</tspan></text>
<text x="88" y="441.64" font-size="17" fill="#5b6478" class="mono" font-weight="400" text-anchor="end"> 6</text>
<text x="112" y="441.64" font-size="24" class="mono" xml:space="preserve"><tspan fill="#c8ccd4">  </tspan><tspan fill="#9cdcfe">&quot;riskScore&quot;</tspan><tspan fill="#c8ccd4">: </tspan><tspan fill="#8fe3a1">87.5</tspan><tspan fill="#c8ccd4">,</tspan></text>
<text x="88" y="483.64" font-size="17" fill="#5b6478" class="mono" font-weight="400" text-anchor="end"> 7</text>
<text x="112" y="483.64" font-size="24" class="mono" xml:space="preserve"><tspan fill="#c8ccd4">  </tspan><tspan fill="#9cdcfe">&quot;tags&quot;</tspan><tspan fill="#c8ccd4">: </tspan><tspan fill="#c4a2ff">[</tspan><tspan fill="#f5b45a">&quot;admin&quot;</tspan><tspan fill="#c8ccd4">, </tspan><tspan fill="#f5b45a">&quot;mfa&quot;</tspan><tspan fill="#c4a2ff">]</tspan><tspan fill="#c8ccd4">,</tspan></text>
<text x="88" y="525.64" font-size="17" fill="#5b6478" class="mono" font-weight="400" text-anchor="end"> 8</text>
<text x="112" y="525.64" font-size="24" class="mono" xml:space="preserve"><tspan fill="#c8ccd4">  </tspan><tspan fill="#9cdcfe">&quot;signIns&quot;</tspan><tspan fill="#c8ccd4">: </tspan><tspan fill="#c4a2ff">[</tspan></text>
<text x="88" y="567.64" font-size="17" fill="#5b6478" class="mono" font-weight="400" text-anchor="end"> 9</text>
<text x="112" y="567.64" font-size="24" class="mono" xml:space="preserve"><tspan fill="#c8ccd4">    </tspan><tspan fill="#50e6ff">{ </tspan><tspan fill="#9cdcfe">&quot;app&quot;</tspan><tspan fill="#c8ccd4">: </tspan><tspan fill="#f5b45a">&quot;Outlook&quot;</tspan><tspan fill="#c8ccd4">, </tspan><tspan fill="#9cdcfe">&quot;when&quot;</tspan><tspan fill="#c8ccd4">: </tspan><tspan fill="#f5b45a">&quot;2026-09-02T14:03Z&quot;</tspan><tspan fill="#50e6ff"> }</tspan><tspan fill="#c8ccd4">,</tspan></text>
<text x="88" y="609.64" font-size="17" fill="#5b6478" class="mono" font-weight="400" text-anchor="end">10</text>
<text x="112" y="609.64" font-size="24" class="mono" xml:space="preserve"><tspan fill="#c8ccd4">    </tspan><tspan fill="#50e6ff">{ </tspan><tspan fill="#9cdcfe">&quot;app&quot;</tspan><tspan fill="#c8ccd4">: </tspan><tspan fill="#f5b45a">&quot;Teams&quot;</tspan><tspan fill="#c8ccd4">,   </tspan><tspan fill="#9cdcfe">&quot;when&quot;</tspan><tspan fill="#c8ccd4">: </tspan><tspan fill="#f5b45a">&quot;2026-09-02T09:47Z&quot;</tspan><tspan fill="#50e6ff"> }</tspan></text>
<text x="88" y="651.64" font-size="17" fill="#5b6478" class="mono" font-weight="400" text-anchor="end">11</text>
<text x="112" y="651.64" font-size="24" class="mono" xml:space="preserve"><tspan fill="#c8ccd4">  </tspan><tspan fill="#c4a2ff">]</tspan><tspan fill="#c8ccd4">,</tspan></text>
<text x="88" y="693.64" font-size="17" fill="#5b6478" class="mono" font-weight="400" text-anchor="end">12</text>
<text x="112" y="693.64" font-size="24" class="mono" xml:space="preserve"><tspan fill="#c8ccd4">  </tspan><tspan fill="#9cdcfe">&quot;location&quot;</tspan><tspan fill="#c8ccd4">: </tspan><tspan fill="#50e6ff">{</tspan></text>
<text x="88" y="735.64" font-size="17" fill="#5b6478" class="mono" font-weight="400" text-anchor="end">13</text>
<text x="112" y="735.64" font-size="24" class="mono" xml:space="preserve"><tspan fill="#c8ccd4">    </tspan><tspan fill="#9cdcfe">&quot;country&quot;</tspan><tspan fill="#c8ccd4">: </tspan><tspan fill="#f5b45a">&quot;US&quot;</tspan><tspan fill="#c8ccd4">,</tspan></text>
<text x="88" y="777.64" font-size="17" fill="#5b6478" class="mono" font-weight="400" text-anchor="end">14</text>
<text x="112" y="777.64" font-size="24" class="mono" xml:space="preserve"><tspan fill="#c8ccd4">    </tspan><tspan fill="#9cdcfe">&quot;city&quot;</tspan><tspan fill="#c8ccd4">: </tspan><tspan fill="#f5b45a">&quot;Reston&quot;</tspan></text>
<text x="88" y="819.64" font-size="17" fill="#5b6478" class="mono" font-weight="400" text-anchor="end">15</text>
<text x="112" y="819.64" font-size="24" class="mono" xml:space="preserve"><tspan fill="#c8ccd4">  </tspan><tspan fill="#50e6ff">}</tspan></text>
<text x="88" y="861.64" font-size="17" fill="#5b6478" class="mono" font-weight="400" text-anchor="end">16</text>
<text x="112" y="861.64" font-size="24" class="mono" xml:space="preserve"><tspan fill="#c8ccd4">}</tspan></text>
<path d="M980,223 C1005.0,223 1005.0,188.0 1030,188.0" fill="none" stroke="#0a84d6" stroke-width="2.5" opacity="0.75"/>
<circle cx="980" cy="223" r="6" fill="#0a84d6"/>
<rect x="1030" y="150" width="1330" height="76" rx="12" fill="#f5f7fb" stroke="#dfe4ee" stroke-width="1.5"/>
