<text x="70" y="76" font-size="44" fill="#1b1f2a" font-weight="700">Anatomy of a JSON Object</text>
<text x="70" y="112" font-size="23" fill="#4b5563" font-weight="400">Keys and values  ·  six data types  ·  an array of objects  ·  an object within an object</text>
<text x="2360" y="76" font-size="22" fill="#8a919e" font-weight="400" text-anchor="end">JSON = JavaScript Object Notation  ·  RFC 8259</text>
<text x="2360" y="110" font-size="20" fill="#8a919e" font-weight="400" text-anchor="end">the representation that flows to, through, and from REST APIs</text>
