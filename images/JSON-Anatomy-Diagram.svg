<text x="156" y="182.0" font-size="19" fill="#5b6478" class="mono" font-weight="400">user.json</text>
<text x="956" y="182.0" font-size="17" fill="#5b6478" class="mono" font-weight="400" text-anchor="end">application/json</text>
<rect x="54" y="498.0" width="912" height="164" rx="10" fill="#c4a2ff" opacity="0.13"/>
